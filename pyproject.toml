[project]
name = "agente-carreira"
version = "0.1.0"
description = "Agente de carreira: perfil-mestre, otimização de currículo, LinkedIn e busca de vagas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "typer>=0.12",
    "rich>=13.7",
    "fpdf2>=2.8",
]

[project.scripts]
agente = "agente_carreira.cli:app"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agente_carreira"]

[tool.pytest.ini_options]
testpaths = ["tests"]
